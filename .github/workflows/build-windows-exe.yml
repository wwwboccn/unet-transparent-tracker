name: Build Windows EXE (V3.0)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Package Windows x64 Standalone EXE
    runs-on: windows-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python 3.11 (x64)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller>=6.3.0

      - name: 4. Run V3.0 Unit Test Suite
        run: |
          python -m unittest discover -s tests -v

      - name: 5. Build Standalone Windows Executables via PyInstaller
        run: |
          python scripts/build_windows_exe.py

      - name: 6. Smoke-Test Built EXE on Windows Runner
        run: |
          .\dist\UNetTracker_V3.0_Portable\UNetTracker_V3.0_Server_CLI.exe --help

      - name: 7. Upload Windows EXE Artifact (Available on Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: UNetTracker-V3.0-Windows-x64-EXE
          path: |
            dist/UNetTracker_V3.0_Windows_x64_Portable.zip
            dist/UNetTracker_V3.0_Portable/UNetTracker_V3.0.exe
            dist/UNetTracker_V3.0_Portable/UNetTracker_V3.0_Server_CLI.exe
          retention-days: 90

      - name: 8. Publish GitHub Release (Triggered when pushing v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UNetTracker_V3.0_Windows_x64_Portable.zip
            dist/UNetTracker_V3.0_Portable/UNetTracker_V3.0.exe
            dist/UNetTracker_V3.0_Portable/UNetTracker_V3.0_Server_CLI.exe
          generate_release_notes: true
