[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unet-transparent-tracker"
version = "3.7.0"
description = "Universal shape-agnostic U-Net real-time tracker (V3.7 True Geometric Center Lock + CUDA + Remote WebSocket/HTTP GPU + Global Hotkeys + Mouse Follow)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.3.0",
    "mss>=7.0.0",
]

[project.scripts]
unet-tracker = "unet_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
